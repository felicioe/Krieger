<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Krieger - Entrar</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="acesso.css" />
</head>
<body>
<div class="caixa">
  <h1>Krieger</h1>
  <p class="sub" id="sub">Contabilidade Condominial · acesso restrito</p>

  <form id="fLogin" autocomplete="on">
    <label for="login">Usuário</label>
    <input id="login" name="username" autocomplete="username" autocapitalize="none" required autofocus />
    <label for="senha">Senha</label>
    <input id="senha" name="password" type="password" autocomplete="current-password" required />
    <div class="linha"><button type="submit" id="bEntrar">Entrar</button></div>
  </form>

  <form id="fTroca" hidden autocomplete="off">
    <label for="atual">Senha atual</label>
    <input id="atual" type="password" autocomplete="current-password" required />
    <label for="nova">Nova senha</label>
    <input id="nova" type="password" autocomplete="new-password" minlength="8" required />
    <label for="conf">Confirme a nova senha</label>
    <input id="conf" type="password" autocomplete="new-password" minlength="8" required />
    <small class="dica">Mínimo de 8 caracteres.</small>
    <div class="linha"><button type="submit" id="bTrocar">Salvar nova senha</button><a class="btn sec" id="cancelar" href="index.html" hidden>Cancelar</a></div>
  </form>

  <div class="msg" id="msg" role="alert"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const modo = new URLSearchParams(location.search);
function aviso(t, tipo = 'erro') { const m = $('msg'); m.textContent = t; m.className = 'msg ' + tipo; }
async function chamar(corpo) {
  const r = await fetch('auth.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(d.erro || 'Erro do servidor (HTTP ' + r.status + ').');
  return d;
}
function mostrarTroca(forcada) {
  $('fLogin').hidden = true; $('fTroca').hidden = false;
  $('sub').textContent = forcada ? 'Defina uma nova senha para continuar.' : 'Alterar minha senha';
  $('cancelar').hidden = forcada;
  $('atual').focus();
}
$('fLogin').addEventListener('submit', async (e) => {
  e.preventDefault(); $('msg').className = 'msg'; $('bEntrar').disabled = true;
  try {
    const d = await chamar({ a: 'entrar', login: $('login').value, senha: $('senha').value });
    if (d.usuario.trocarSenha) { $('atual').value = $('senha').value; mostrarTroca(true); $('nova').focus(); }
    else location.replace('index.html');
  } catch (err) { aviso(err.message); } finally { $('bEntrar').disabled = false; }
});
$('fTroca').addEventListener('submit', async (e) => {
  e.preventDefault(); $('msg').className = 'msg';
  if ($('nova').value !== $('conf').value) return aviso('A confirmação não confere com a nova senha.');
  $('bTrocar').disabled = true;
  try { await chamar({ a: 'minha_senha', atual: $('atual').value, nova: $('nova').value }); aviso('Senha alterada. Redirecionando...', 'ok'); setTimeout(() => location.replace('index.html'), 900); }
  catch (err) { aviso(err.message); $('bTrocar').disabled = false; }
});
(async () => { // se já houver sessão: troca de senha (pedida ou obrigatória) ou segue para o sistema
  try {
    const r = await fetch('auth.php?a=eu', { cache: 'no-store' });
    if (!r.ok) return;
    const { usuario } = await r.json();
    if (usuario.trocarSenha) mostrarTroca(true);
    else if (modo.has('senha')) mostrarTroca(false);
    else location.replace('index.html');
  } catch {}
})();
</script>
</body>
</html>
